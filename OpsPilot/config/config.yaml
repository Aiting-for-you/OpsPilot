# OpsPilot 本地开发配置

app:
  name: "opspilot"
  version: "0.1.0"
  debug: true

state_machine:
  initial_state: "INIT"
  max_retry: 3

memory:
  # Redis 配置
  redis:
    enabled: true
    host: "localhost"
    port: 6379
  chromadb:
    persist_directory: "./data/chromadb"
    collection_name: "opspilot_memory"

llm:
  # 智谱 GLM 模型配置
  provider: "zhipuai"
  model_name: "glm-4-flash"  # 免费模型
  api_key: "3e36e5e33d2e4055bf7e3bdcda8b270c.MQ696xC3uv50KktT"
  api_base: "https://open.bigmodel.cn/api/paas/v4"

mcp:
  servers: []

api:
  host: "0.0.0.0"
  port: 8000
