[project]
name = "opspilot"
version = "0.1.0"
description = "企业级运维智能体系统"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    # AgentScope - 多智能体调度核心（决策层）
    "agentscope>=0.1.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    # LangChain - 工具调用与RAG（执行层）
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    # LangChain 向量存储 - 按文档要求使用 ChromaDB
    "langchain-chroma>=0.1.0",
    # LangChain Redis - 按文档要求用于会话存储
    "langchain-redis>=0.0.1",
    "redis>=5.0.0",
    # 向量检索与嵌入
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["opspilot*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

