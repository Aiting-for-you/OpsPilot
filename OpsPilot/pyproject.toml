[project]
name = "opspilot"
version = "0.1.0"
description = "企业级运维智能体系统"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",  # HTTP 客户端（用于 LLM 连接测试）
    # 系统监控与服务管理
    "psutil>=5.9.0",  # 进程和系统监控
    "pystray>=0.19.0",  # 系统托盘支持（可选）
    "Pillow>=10.0.0",  # 图标生成（pystray 依赖）
    # AgentScope - 多智能体调度核心（决策层）
    "agentscope>=0.1.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    # AgentScope Runtime - 生产级运行时
    # - 工具沙箱：安全隔离执行
    # - AaaS API：Agent-as-a-Service
    # - A2A 协议：智能体间通信
    "agentscope-runtime>=0.1.0",
    # LangChain - 工具调用与RAG（执行层）
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    # LangChain 向量存储 - 按文档要求使用 ChromaDB
    "langchain-chroma>=0.1.0",
    # LangChain Redis - 按文档要求用于会话存储
    "langchain-redis>=0.0.1",
    "redis>=5.0.0",
    # 向量检索与嵌入
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    # OpenTelemetry - 可观测性追踪
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    # SSE 流式输出
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["opspilot*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

