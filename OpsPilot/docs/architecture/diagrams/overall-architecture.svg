  <path class="line" d="M120,340 L120,380"/>
  <path class="line" d="M230,340 L230,380"/>
  <path class="line" d="M340,340 L340,380"/>
  <path class="line" d="M450,340 L450,380"/>
  <path class="line" d="M560,340 L560,365 L670,365 L670,380"/>
  <path class="line" d="M670,340 L670,380"/>
  <path class="line" d="M780,340 L780,380"/>
  <path class="line" d="M890,340 L890,380"/>
  
