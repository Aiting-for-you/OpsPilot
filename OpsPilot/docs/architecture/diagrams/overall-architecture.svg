  <rect class="node" x="70" y="490" width="100" height="50" fill="#6C8EBF"/><text class="label" x="120" y="518">自愈工具</text>
  <rect class="node" x="180" y="490" width="100" height="50" fill="#6C8EBF"/><text class="label" x="230" y="518">MCP客户端</text>
  <rect class="node" x="290" y="490" width="100" height="50" fill="#6C8EBF"/><text class="label" x="340" y="518">MCP数据库</text>
  <rect class="node" x="400" y="490" width="100" height="50" fill="#6C8EBF"/><text class="label" x="450" y="518">MCP搜索</text>
  <rect class="node" x="510" y="490" width="100" height="50" fill="#82B366"/><text class="label" x="560" y="518">记忆管理</text>
  <rect class="node" x="620" y="490" width="100" height="50" fill="#82B366"/><text class="label" x="670" y="518">向量化</text>
  <rect class="node" x="730" y="490" width="100" height="50" fill="#82B366"/><text class="label" x="780" y="518">检索器</text>
  <rect class="node" x="840" y="490" width="100" height="50" fill="#82B366"/><text class="label" x="890" y="518">索引器</text>
  
  <!-- 连接线 R5-R6 -->
