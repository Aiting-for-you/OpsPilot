  <rect class="node" x="70" y="290" width="100" height="50" fill="#1a5f7a"/><text class="label" x="120" y="318">意图Agent</text>
  <rect class="node" x="180" y="290" width="100" height="50" fill="#1a5f7a"/><text class="label" x="230" y="318">规划Agent</text>
  <rect class="node" x="290" y="290" width="100" height="50" fill="#1a5f7a"/><text class="label" x="340" y="318">执行Agent</text>
  <rect class="node" x="400" y="290" width="100" height="50" fill="#1a5f7a"/><text class="label" x="450" y="318">验证Agent</text>
  <rect class="node" x="510" y="290" width="100" height="50" fill="#1a5f7a"/><text class="label" x="560" y="318">协作模块</text>
  <rect class="node" x="620" y="290" width="100" height="50" fill="#1a5f7a"/><text class="label" x="670" y="318">博弈谈判</text>
  <rect class="node" x="730" y="290" width="100" height="50" fill="#2e7d32"/><text class="label" x="780" y="318">定价模块</text>
  <rect class="node" x="840" y="290" width="100" height="50" fill="#2e7d32"/><text class="label" x="890" y="318">客服模块</text>
  
