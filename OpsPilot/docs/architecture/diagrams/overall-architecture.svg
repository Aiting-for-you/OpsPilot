  <rect class="node" x="70" y="590" width="100" height="50" fill="#82B366"/><text class="label" x="120" y="618">压缩器</text>
  <rect class="node" x="180" y="590" width="100" height="50" fill="#82B366"/><text class="label" x="230" y="618">推理链</text>
  <rect class="node" x="290" y="590" width="100" height="50" fill="#82B366"/><text class="label" x="340" y="618">提示词</text>
  <rect class="node" x="400" y="590" width="100" height="50" fill="#82B366"/><text class="label" x="450" y="618">LLM运行时</text>
  <ellipse class="node" cx="560" cy="615" rx="50" ry="25" fill="#82B366"/><text class="label" x="560" y="618">PostgreSQL</text>
  <ellipse class="node" cx="670" cy="615" rx="45" ry="25" fill="#82B366"/><text class="label" x="670" y="618">Redis</text>
  <ellipse class="node" cx="780" cy="615" rx="45" ry="25" fill="#82B366"/><text class="label" x="780" y="618">ChromaDB</text>
  <ellipse class="node" cx="890" cy="615" rx="45" ry="25" fill="#82B366"/><text class="label" x="890" y="618">文件存储</text>
  
  <!-- 连接线 R6-R7 -->
