  <path class="line" d="M230,640 L230,680"/>
  <path class="line" d="M340,640 L340,680"/>
  <path class="line" d="M450,640 L450,680"/>
  
  <!-- 第七行：可观测 -->
  <text class="row-label" x="55" y="715">可观测</text>
  <rect class="node" x="70" y="690" width="100" height="50" fill="#D79B00"/><text class="label" x="120" y="718">可观测性</text>
  <rect class="node" x="180" y="690" width="100" height="50" fill="#D79B00"/><text class="label" x="230" y="718">日志</text>
  <rect class="node" x="290" y="690" width="100" height="50" fill="#D79B00"/><text class="label" x="340" y="718">指标</text>
  <rect class="node" x="400" y="690" width="100" height="50" fill="#D79B00"/><text class="label" x="450" y="718">链路追踪</text>
  
  <!-- 图例 -->
  <g transform="translate(200, 780)">
    <rect x="0" y="0" width="20" height="20" fill="#083B75" rx="4"/><text x="30" y="15" font-size="12" fill="#333">核心组件</text>
    <rect x="120" y="0" width="20" height="20" fill="#1a5f7a" rx="4"/><text x="150" y="15" font-size="12" fill="#333">Agent</text>
    <rect x="220" y="0" width="20" height="20" fill="#2e7d32" rx="4"/><text x="250" y="15" font-size="12" fill="#333">业务模块</text>
    <rect x="340" y="0" width="20" height="20" fill="#6C8EBF" rx="4"/><text x="370" y="15" font-size="12" fill="#333">工具集成</text>
    <rect x="460" y="0" width="20" height="20" fill="#82B366" rx="4"/><text x="490" y="15" font-size="12" fill="#333">存储支撑</text>
    <rect x="580" y="0" width="20" height="20" fill="#B85450" rx="4"/><text x="610" y="15" font-size="12" fill="#333">外部系统</text>
    <rect x="700" y="0" width="20" height="20" fill="#D79B00" rx="4"/><text x="730" y="15" font-size="12" fill="#333">可观测</text>
  </g>
