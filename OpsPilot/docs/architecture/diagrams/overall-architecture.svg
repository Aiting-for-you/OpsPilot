  <path class="line" d="M230,540 L230,580"/>
  <path class="line" d="M340,540 L340,580"/>
  <path class="line" d="M450,540 L450,580"/>
  <path class="line" d="M560,540 L560,580"/>
  <path class="line" d="M670,540 L670,580"/>
  <path class="line" d="M780,540 L780,580"/>
  <path class="line" d="M890,540 L890,580"/>
  
