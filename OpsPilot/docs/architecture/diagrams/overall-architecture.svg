  <rect class="node" x="180" y="390" width="100" height="50" fill="#2e7d32"/><text class="label" x="230" y="418">财务模块</text>
  <rect class="node" x="290" y="390" width="100" height="50" fill="#2e7d32"/><text class="label" x="340" y="418">合规模块</text>
  <rect class="node" x="400" y="390" width="100" height="50" fill="#6C8EBF"/><text class="label" x="450" y="418">电商工具</text>
  <rect class="node" x="510" y="390" width="100" height="50" fill="#6C8EBF"/><text class="label" x="560" y="418">数据库工具</text>
  <rect class="node" x="620" y="390" width="100" height="50" fill="#6C8EBF"/><text class="label" x="670" y="418">HTTP工具</text>
  <rect class="node" x="730" y="390" width="100" height="50" fill="#6C8EBF"/><text class="label" x="780" y="418">文件工具</text>
  <rect class="node" x="840" y="390" width="100" height="50" fill="#6C8EBF"/><text class="label" x="890" y="418">通知工具</text>
  
