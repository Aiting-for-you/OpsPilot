<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#888"/>
    </marker>
    <style>
      .node { rx: 8; }
      .label { font-size: 11px; font-weight: 600; fill: white; text-anchor: middle; }
      .sub-label { font-size: 9px; fill: rgba(255,255,255,0.7); text-anchor: middle; }
      .row-label { font-size: 11px; fill: #666; text-anchor: end; }
      .line { stroke: #ccc; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  
  <!-- 背景 -->
  <rect x="10" y="10" width="1180" height="880" rx="20" fill="#fafafa" stroke="#083B75" stroke-width="2"/>
  
  <!-- 标题 -->
  <text x="600" y="50" text-anchor="middle" font-size="22" font-weight="bold" fill="#083B75">OpsPilot 系统架构图</text>
  
  <!-- 第一行：用户接入 -->
  <text class="row-label" x="55" y="115">用户接入</text>
  <rect class="node" x="70" y="90" width="100" height="50" fill="#B85450"/><text class="label" x="120" y="118">Web前端</text>
  <rect class="node" x="180" y="90" width="100" height="50" fill="#B85450"/><text class="label" x="230" y="118">CLI工具</text>
  <rect class="node" x="290" y="90" width="100" height="50" fill="#B85450"/><text class="label" x="340" y="118">API客户端</text>
  <rect class="node" x="400" y="90" width="100" height="50" fill="#083B75"/><text class="label" x="450" y="118">API网关</text>
  <rect class="node" x="510" y="90" width="100" height="50" fill="#083B75"/><text class="label" x="560" y="118">认证授权</text>
  <rect class="node" x="620" y="90" width="100" height="50" fill="#083B75"/><text class="label" x="670" y="118">限流熔断</text>
  <rect class="node" x="730" y="90" width="100" height="50" fill="#B85450"/><text class="label" x="780" y="118">ERP系统</text>
  <rect class="node" x="840" y="90" width="100" height="50" fill="#B85450"/><text class="label" x="890" y="118">WMS系统</text>
  
  <!-- 连接线 R1-R2 -->
  <path class="line" d="M120,140 L120,165 L450,165 L450,180"/>
  <path class="line" d="M230,140 L230,165 L450,165"/>
  <path class="line" d="M340,140 L340,165 L450,165"/>
  <path class="line" d="M450,140 L450,180"/>
  <path class="line" d="M560,140 L560,180"/>
  
  <!-- 第二行：编排调度 -->
  <text class="row-label" x="55" y="215">编排调度</text>
  <rect class="node" x="70" y="190" width="100" height="50" fill="#083B75"/><text class="label" x="120" y="218">编排器</text>
  <rect class="node" x="180" y="190" width="100" height="50" fill="#083B75"/><text class="label" x="230" y="218">调度器</text>
  <rect class="node" x="290" y="190" width="100" height="50" fill="#083B75"/><text class="label" x="340" y="218">流程编排</text>
  <rect class="node" x="400" y="190" width="100" height="50" fill="#083B75"/><text class="label" x="450" y="218">SOP执行</text>
  <rect class="node" x="510" y="190" width="100" height="50" fill="#083B75"/><text class="label" x="560" y="218">状态机</text>
  <rect class="node" x="620" y="190" width="100" height="50" fill="#B85450"/><text class="label" x="670" y="218">物流系统</text>
  <rect class="node" x="730" y="190" width="100" height="50" fill="#B85450"/><text class="label" x="780" y="218">支付系统</text>
  <rect class="node" x="840" y="190" width="100" height="50" fill="#B85450"/><text class="label" x="890" y="218">LLM服务</text>
  
  <!-- 连接线 R2-R3 -->
  <path class="line" d="M120,240 L120,280"/>
  <path class="line" d="M230,240 L230,265 L340,265 L340,280"/>
  <path class="line" d="M340,240 L340,280"/>
  <path class="line" d="M450,240 L450,265 L560,265 L560,280"/>
  <path class="line" d="M560,240 L560,280"/>
  
